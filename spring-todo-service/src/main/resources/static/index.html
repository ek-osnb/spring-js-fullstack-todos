<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            padding: 2rem;
        }
    </style>
    <title>Todo CRUD</title>
</head>

<body>
    <h1 class="text-center">TODO CRUD</h1>
    <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

    <form id="todoForm">
        <input type="hidden" id="todoId" name="id">
        <input type="text" id="todoTitle" name="title" placeholder="Enter a todo" required>
        <select id="userId" name="userId" required>
            <option value="">Choose user…</option>
        </select>
        <label for="completed">Completed</label>
        <input type="checkbox" id="completed" name="completed">

        <button type="submit" id="submitButton" class="btn btn-primary">Add Todo</button>
        <button type="button" id="cancelEdit" class="btn btn-secondary d-none">Cancel</button>
    </form>

    <div>
        <h2>Search todos</h2>
        <input id="searchBox" type="text"></input>
    </div>

    <table class="table">
        <thead>
            <tr id="todoTableHeader" style="user-select: none; cursor: pointer;">
                <th scope="col" data-sort-key="title">Title <span class="sort-indicator" id="sort-title"></span></th>
                <th scope="col" data-sort-key="username">User <span class="sort-indicator" id="sort-username"></span></th>
                <th scope="col">Completed</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody id="todoTableBody" style="cursor: pointer;">
        </tbody>
    </table>

    <script type="module" src="app.js"></script>
</body>

</html>
